name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Release ${context.ref.replace('refs/tags/', '')}`,
              body: 'Cross-platform release for MLImpute application',
              draft: false,
              prerelease: false,
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            python_arch: 'universal2'
            package_suffix: 'cpu'
          - platform: 'ubuntu-22.04'
            args: ''
            python_arch: 'x86_64'
            package_suffix: 'cpu'
          - platform: 'ubuntu-22.04'
            args: ''
            python_arch: 'x86_64'
            package_suffix: 'gpu'
          - platform: 'windows-latest'
            args: ''
            python_arch: 'x86_64'
            package_suffix: 'cpu'
          - platform: 'windows-latest'
            args: ''
            python_arch: 'x86_64'
            package_suffix: 'gpu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Free up disk space (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Remove unnecessary packages to free up space
          sudo apt-get autoremove -y
          sudo apt-get clean
          # Remove large directories that aren't needed
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          # Show available disk space
          df -h

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: latest
          locked: false

      - name: Install pixi environment
        run: pixi install
        env:
          CONDA_OVERRIDE_CUDA: ${{ matrix.package_suffix == 'gpu' && '12.0' || '' }}

      - name: Build Python wheelhouse (CPU)
        if: matrix.package_suffix == 'cpu'
        run: npm run package
        shell: bash

      - name: Build Python wheelhouse (GPU)
        if: matrix.package_suffix == 'gpu'
        run: npm run package:gpu
        shell: bash
        env:
          CONDA_OVERRIDE_CUDA: "12.0"

      - name: Clean up temporary files (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Clean pixi cache to free up space (skip if it fails)
          pixi clean cache || echo "Pixi cache clean failed, continuing..."
          # Remove pip cache
          rm -rf ~/.cache/pip
          # Clean npm cache
          npm cache clean --force
          # Show remaining space
          df -h

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          releaseName: 'MLImpute ${{ github.ref_name }}'
          releaseBody: |
            Cross-platform release for MLImpute application
            
            ## Features
            - Machine learning-based haplotype imputation
            - BiMamba state space models
            - ModernBERT transformer models  
            - HMM-based methods
            - Interactive matrix visualization
            - Self-contained Python runtime
            
            ## Platform Notes
            - **macOS**: Universal binary (Apple Silicon + Intel) - CPU only
            - **Linux**: Supports both CPU and GPU variants
            - **Windows**: Supports both CPU and GPU variants
            
            Choose the appropriate variant for your system and GPU requirements.
          releaseDraft: false
          prerelease: false

  cleanup-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Delete release if builds failed
        if: needs.build-tauri.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }}
            })
