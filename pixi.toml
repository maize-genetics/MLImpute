[workspace]
name      = "grits-env-pixi"
channels  = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[activation.env]
PYTHONPATH = "${PIXI_PROJECT_ROOT}/src"

# Base "CPU only" dependencies
[dependencies]
python       = "3.10.*"
pip          = "*"
numpy        = "*"
pandas       = "*"
scikit-learn = "*"
numba        = ">=0.61.2,<0.62"
wandb        = ">=0.21.0,<0.22"

[pypi-dependencies]
transformers = "*"
pytest       = "*"
pytest-cov   = "*"
lightning    = "*"
tqdm         = "*"
pysam        = "*"
torch        = "*"
torchvision  = "*"


# "GPU only" dependencies (Linux and Windows)
[feature.gpu]
platforms = ["linux-64", "win-64"]

[feature.gpu.system-requirements]
cuda = "12"

[feature.gpu.dependencies]
cuda-version = "12.8.*"
cuda-toolkit = "*"

[feature.gpu.pypi-dependencies]
mamba-ssm = "*"
torch = "*"
torchvision = "*"


# Documentation site (MkDocs Material)
[feature.docs.pypi-dependencies]
mkdocs-material                = "*"
mkdocstrings                   = { version = "*", extras = ["python"] }
pymdown-extensions             = "*"
mkdocs-include-markdown-plugin = "*"
black                          = "*"  # formats rendered Python API signatures

[feature.docs.tasks]
# Pull docs from the accompanying seq_sim repo into docs/_external/
docs-fetch = "bash scripts/fetch-external-docs.sh"
# Live preview at http://127.0.0.1:8000 (fetches external docs first)
docs-serve = { cmd = "mkdocs serve", depends-on = ["docs-fetch"] }
# Build the static site into ./site (fetches external docs first)
docs-build = { cmd = "mkdocs build", depends-on = ["docs-fetch"] }


# Set up environments
[environments]
default = []      # pixi install
gpu     = ["gpu"] # pixi install --environment gpu
docs    = ["docs"] # pixi install --environment docs

